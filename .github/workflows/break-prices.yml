# Once a day, looks up eBay Buy It Now asking prices for the names in the breaks that haven't run yet
# (build/breaks/prices.py, eBay Browse API) and rebuilds the Spot Builder, which uses them for its "Market prices"
# setting. Break pages do not show prices.
# Needs two repository secrets from a free eBay developer account (production keyset):
#   EBAY_CLIENT_ID      the App ID (Client ID)
#   EBAY_CLIENT_SECRET  the Cert ID (Client Secret)
# Without them the job skips quietly.
name: Break prices

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: break-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up eBay asking prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python build/breaks/prices.py
      # Save the new prices, then rebuild the pages on top of the latest main and push. The lookup takes up to an
      # hour, and other commits (page updates) often land meanwhile; rebuilding on top of them instead of rebasing the
      # generated pages means a conflict can't throw the prices away (it did on Nov 27, 2026).
      - name: Rebuild on the latest main and push
        run: |
          cp build/breaks/watch/prices.json "$RUNNER_TEMP/prices.json"
          git config user.name "Break prices"
          git config user.email "actions@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/prices.json" build/breaks/watch/prices.json
            python build/breaks/build.py > /dev/null
            python build/breaks/builder.py > /dev/null
            python build/breaks/hub.py > /dev/null
            if [ -z "$(git status --porcelain build/breaks breaks owner)" ]; then ok=1; break; fi
            git add build/breaks breaks owner
            git commit -q -m "Break prices: eBay asking prices updated"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "Could not push the update"; exit 1; fi
