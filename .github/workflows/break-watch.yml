# Checks Acme Packs, JWJ, Colfax and Run Good Life for new or removed products every 5 minutes, and whether RGL's YouTube stream is live,
# and commits what it finds to build/breaks/watch/ (only when something changed).
# A scheduled Claude task reads build/breaks/watch/queue.json and builds the break pages.
name: Break watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/break-watch.yml
      - build/breaks/watch.py

permissions:
  contents: write

concurrency:
  group: break-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the stores
        run: python build/breaks/watch.py
      - name: Rebuild the break pages (picks up new title card images and links, like GB1040's)
        run: |
          python build/breaks/build.py > /dev/null
          python build/breaks/hub.py > /dev/null
      - name: Commit anything new
        run: |
          if [ -n "$(git status --porcelain build/breaks breaks)" ]; then
            git config user.name "Break watcher"
            git config user.email "actions@users.noreply.github.com"
            git add build/breaks breaks
            git commit -m "Break watcher: store products changed"
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "Could not push the update"; exit 1; fi
          fi
